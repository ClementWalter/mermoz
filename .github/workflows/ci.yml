name: ci
on:
  push:
    branches: [main]
  pull_request:

jobs:
  rust:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --release --all-targets -- -D warnings
      - run: cargo build --release
      - run: cargo test --release --workspace
      # Speed bar: fails the build if any hot path misses its budget at 500k messages.
      # This runner (3-vCPU VM, 7 GB RAM for a 4 GB mailbox, virtual disk) measured reads
      # at up to 1.2x their budget and the sync's write path at up to 2.6x (lock held
      # 110-500 ms per batch, one batch's fsync 100-250 ms); a Mac runs it at 0.4x.
      - run: cargo run --release -p mermoz-core --example bench -- 500000
        env:
          MERMOZ_BENCH_READ_SCALE: "1.5"
          MERMOZ_BENCH_WRITE_SCALE: "4"

  app:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - run: swift test -c release
        working-directory: app

  scripts:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      # Includes a real codesign run with a throwaway identity in a temporary keychain.
      - run: uv run --with pytest --with click pytest scripts/tests -q
        env:
          MERMOZ_SIGNING_E2E: "1"

  iphone:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: astral-sh/setup-uv@v6
      - run: brew install xcodegen
      - run: cargo test --release -p mermoz-mobile
      - run: uv run scripts/build_app.py --platform ios-simulator --test
