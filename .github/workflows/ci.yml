name: ci
on:
  push:
    branches: [main]
  pull_request:

jobs:
  rust:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --release --all-targets -- -D warnings
      - run: cargo build --release
      - run: cargo test --release --workspace
      # Speed bar: fails the build if any hot path misses its budget at 500k messages.
      - run: cargo run --release -p mermoz-core --example bench -- 500000

  app:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - run: swift test -c release
        working-directory: app

  scripts:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      # Includes a real codesign run with a throwaway identity in a temporary keychain.
      - run: uv run --with pytest --with click pytest scripts/tests -q
        env:
          MERMOZ_SIGNING_E2E: "1"

  iphone:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: astral-sh/setup-uv@v6
      - run: brew install xcodegen
      - run: cargo test --release -p mermoz-mobile
      - run: uv run scripts/build_app.py --platform ios-simulator --test
