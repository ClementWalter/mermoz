<!doctype html>
<!--
  Source of the welcome email's pictures (email clients can't run SVG or JS, so the
  landing's sky is baked into PNGs). Rendered at 2x by scripts/email_art.py:
    ?part=header → site/assets/email-sky.png     (1120×420, top of the card)
    ?part=footer → site/assets/email-clouds.png  (1120×200, bottom of the card)
-->
<html lang="en">
<head>
<meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@600&display=swap" rel="stylesheet">
<style>
  html, body { margin: 0; padding: 0; }
  #sky { position: relative; width: 1120px; overflow: hidden; }
  .header { height: 420px; background:
      /* Fades into the card colour so the picture has no bottom edge. */
      linear-gradient(180deg, transparent 72%, #F7FBFF 100%),
      radial-gradient(700px 360px at 18% 8%, #FFFFFF 0%, transparent 60%),
      radial-gradient(600px 320px at 88% 85%, #E3DAFB66 0%, transparent 60%),
      linear-gradient(180deg, #F2F8FE 0%, #E6F0FA 78%, #F7FBFF 100%); }
  .footer { height: 200px; background: linear-gradient(180deg, #F7FBFF 0%, #EEF5FC 100%); }
  #sky > div { position: absolute; }
  .note { font-family: "Caveat", "Bradley Hand", cursive; font-size: 46px; color: #5F7F99; transform: rotate(-6deg); }
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <filter id="pencil">
    <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" seed="3" result="noise"/>
    <feDisplacementMap in="SourceGraphic" in2="noise" scale="2.4"/>
  </filter>
</svg>
<div id="sky"></div>
<script>
  // Same drawing code and seed as the landing (site/main.js), so the sky matches.
  let seed = 7;
  const rand = () => ((seed = (seed * 16807) % 2147483647) / 2147483647);

  function paperBall(r) {
    const pts = [];
    for (let i = 0; i < 13; i++) {
      const a = (i / 13) * Math.PI * 2, rr = r * (0.84 + rand() * 0.22);
      pts.push([r + Math.cos(a) * rr, r + Math.sin(a) * rr]);
    }
    const creases = [];
    for (let i = 0; i < 6; i++) {
      const a = rand() * Math.PI * 2, b = a + 0.8 + rand() * 1.6;
      const x1 = r + Math.cos(a) * r * 0.75, y1 = r + Math.sin(a) * r * 0.75;
      const mx = r + (rand() - 0.5) * r * 0.6, my = r + (rand() - 0.5) * r * 0.6;
      const x2 = r + Math.cos(b) * r * 0.7, y2 = r + Math.sin(b) * r * 0.7;
      creases.push(`M${x1} ${y1} L${mx} ${my} L${x2} ${y2}`);
    }
    const id = `g${Math.floor(rand() * 1e9)}`, s = r * 2;
    return `<svg viewBox="-4 -4 ${s + 8} ${s + 8}" width="${s + 8}" height="${s + 8}">
      <defs><radialGradient id="${id}" cx="35%" cy="30%" r="75%">
        <stop offset="0%" stop-color="#FFFFFF"/><stop offset="65%" stop-color="#EEF5FC"/><stop offset="100%" stop-color="#CADCEC"/>
      </radialGradient></defs>
      <g filter="url(#pencil)">
        <polygon points="${pts.map((p) => p.join(",")).join(" ")}" fill="url(#${id})" stroke="#8FA9BF" stroke-width="1.3" stroke-linejoin="round"/>
        <path d="${creases.join(" ")}" fill="none" stroke="#9DB6CB" stroke-width="1" stroke-linecap="round"/>
      </g></svg>`;
  }

  function hatchedCloud(w) {
    const h = w * 0.45, id = `c${Math.floor(rand() * 1e9)}`;
    const cloud = `M${w * 0.12} ${h * 0.9} C ${w * 0.0} ${h * 0.9}, ${w * 0.0} ${h * 0.5}, ${w * 0.2} ${h * 0.52}
      C ${w * 0.22} ${h * 0.15}, ${w * 0.5} ${h * 0.05}, ${w * 0.56} ${h * 0.36}
      C ${w * 0.66} ${h * 0.18}, ${w * 0.92} ${h * 0.28}, ${w * 0.86} ${h * 0.56}
      C ${w * 1.0} ${h * 0.6}, ${w * 0.98} ${h * 0.92}, ${w * 0.84} ${h * 0.9} Z`;
    const lines = [];
    for (let x = -h; x < w; x += 9) lines.push(`<path d="M${x} ${h} L${x + h} 0"/>`);
    return `<svg viewBox="0 0 ${w} ${h}" width="${w}" height="${h}">
      <defs><clipPath id="${id}"><path d="${cloud}"/></clipPath></defs>
      <g filter="url(#pencil)" fill="none" stroke="#9AB4CA" stroke-linecap="round">
        <g clip-path="url(#${id})" stroke-width="1.1">${lines.join("")}</g>
        <path d="${cloud}" stroke-width="1.6"/>
      </g></svg>`;
  }

  const plane = (w, angle) => `<svg viewBox="0 0 120 80" width="${w}" height="${w * 2 / 3}"
      style="transform:rotate(${angle}deg);filter:drop-shadow(0 14px 14px rgba(31,111,181,.2))">
    <g filter="url(#pencil)">
      <path d="M2 40 L118 6 L46 48 Z" fill="#FFFFFF" stroke="#5F7F99" stroke-width="1.6" stroke-linejoin="round"/>
      <path d="M46 48 L118 6 L62 74 Z" fill="#DCEBFA" stroke="#5F7F99" stroke-width="1.6" stroke-linejoin="round"/>
      <path d="M46 48 L54 60 L62 74" fill="none" stroke="#5F7F99" stroke-width="1.2"/>
    </g></svg>`;

  const trail = (w, h, d) => `<svg width="${w}" height="${h}" style="overflow:visible">
    <path d="${d}" fill="none" stroke="#5F7F99" stroke-width="2.4" stroke-dasharray="2 10"
      stroke-linecap="round" opacity="0.6" filter="url(#pencil)"/></svg>`;

  const sky = document.getElementById("sky");
  const put = (html, x, y, z = 1, style = "") => {
    const el = document.createElement("div");
    el.innerHTML = html;
    el.style.cssText = `left:${x}px;top:${y}px;z-index:${z};${style}`;
    sky.appendChild(el);
  };

  const part = new URLSearchParams(location.search).get("part") || "header";
  sky.className = part;
  if (part === "header") {
    put(hatchedCloud(300), 40, 40, 1, "opacity:.6");
    put(hatchedCloud(240), 690, 18, 1, "opacity:.5");
    put(hatchedCloud(340), 600, 250, 1, "opacity:.55");
    put(hatchedCloud(200), 230, 300, 1, "opacity:.45");
    [[60, 260, 26], [330, 120, 16], [470, 40, 12], [560, 330, 20], [960, 300, 30], [1030, 70, 14], [880, 200, 10]]
      .forEach(([x, y, r]) => put(paperBall(r), x, y, 2));
    // A loop-the-loop that ends at the plane's tail.
    put(trail(1120, 420, "M-20 360 C 120 330, 220 250, 330 260 C 470 272, 470 120, 380 130 C 300 140, 330 250, 470 240 C 600 230, 700 170, 800 150"), 0, 0, 3);
    put(plane(190, -14), 790, 72, 4);
    put(`<span class="note">bon vol !</span>`, 420, 300, 4);
  } else {
    put(hatchedCloud(260), 30, 60, 1, "opacity:.5");
    put(hatchedCloud(320), 400, 20, 1, "opacity:.45");
    put(hatchedCloud(240), 820, 80, 1, "opacity:.5");
    [[300, 120, 14], [760, 40, 18], [1050, 30, 11]].forEach(([x, y, r]) => put(paperBall(r), x, y, 2));
    put(trail(1120, 200, "M-20 150 C 200 170, 420 110, 640 120 C 800 128, 900 90, 960 60"), 0, 0, 3);
    put(plane(90, -18), 950, 22, 4);
  }
  document.fonts.ready.then(() => document.body.setAttribute("data-ready", "1"));
</script>
</body>
</html>
